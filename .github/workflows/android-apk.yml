name: FRAME X AI Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frame-x-ai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build FRAME X AI Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify Android project
        run: |
          gradle --version
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

      - name: Run Android unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build FRAME X AI APK
        run: gradle clean assembleDebug assembleRelease lintDebug --no-daemon --stacktrace

      - name: Verify APK exists before runtime test
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload FRAME X AI APK
        uses: actions/upload-artifact@v4
        with:
          name: FRAME-X-AI-apks
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 8
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop ai.framex.app
            adb shell am start -W -n ai.framex.app/.MainActivity
            sleep 8
            LOG="$(adb logcat -d -v threadtime)"
            printf '%s\n' "$LOG"
            if printf '%s\n' "$LOG" | grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: ai.framex.app" >/dev/null; then
              echo "FRAME X AI startup crash detected"
              exit 1
            fi
            echo "FRAME X AI launched without an AndroidRuntime crash"
